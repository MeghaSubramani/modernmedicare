{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}<div class="page"><div class="container"><div class="profile-cover"></div><div class="cardx profile-card p-4"><div class="d-flex flex-wrap gap-4 align-items-end mb-4"><div class="avatar-lg"><i class="bi bi-person"></i></div><div><div class="eyebrow">Patient profile</div><h2 class="fw-bold mb-1">{{current_user.name}}</h2><div class="muted">{{current_user.email}}</div></div></div><form method="post"><div class="row g-3"><div class="col-md-4"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="dob" value="{{patient.dob or ''}}"></div><div class="col-md-4"><label class="form-label">Gender</label><select class="form-select" name="gender"><option value="">Select</option>{% for x in ['Female','Male','Other'] %}<option {% if patient.gender==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Blood group</label><input class="form-control" name="blood_group" value="{{patient.blood_group or ''}}" placeholder="O+"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{patient.phone or ''}}"></div><div class="col-md-6"><label class="form-label">Emergency contact</label><input class="form-control" name="emergency_contact" value="{{patient.emergency_contact or ''}}"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3">{{patient.address or ''}}</textarea></div></div><button class="btn btn-gradient mt-4 px-4">Save profile</button></form></div></div></div>{% endblock %}
