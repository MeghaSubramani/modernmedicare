{% extends 'base.html' %}{% block title %}Create Account{% endblock %}{% block content %}<div class="auth-wrap"><div class="cardx auth-card"><div class="text-center mb-4"><div class="iconbox mx-auto mb-3"><i class="bi bi-person-plus"></i></div><h2 class="fw-bold">Create your account</h2><p class="muted">Start managing appointments in minutes.</p></div><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="6" required><button class="btn btn-gradient w-100 py-3">Create patient account</button></form><div class="text-center mt-4">Already registered? <a href="{{url_for('login')}}">Sign in</a></div></div></div>{% endblock %}
